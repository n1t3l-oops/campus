<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007AFF"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Campus</title>
<style>
:root{--bg:#F5F5F7;--sf:#fff;--sf2:#ececf0;--tx:#1C1C1E;--t2:#8E8E93;--ac:#007AFF;--gr:#34C759;--or:#FF9500;--rd:#FF3B30}
@media(prefers-color-scheme:dark){:root{--bg:#111114;--sf:#1C1C20;--sf2:#26262B;--tx:#F5F5F7;--t2:#98989F;--ac:#0A84FF}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:30px;margin:18px 0 2px;letter-spacing:-.5px}.sub{color:var(--t2);margin:0 0 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.refresh{margin-top:18px;padding:10px 14px;border-radius:14px;background:var(--sf);font-size:14px;font-weight:600;white-space:nowrap}.refresh:disabled{opacity:.55}
.days{display:flex;gap:6px;margin-bottom:14px}
.d{flex:1;background:var(--sf);border-radius:14px;padding:8px 0;text-align:center;font-size:12px;color:var(--t2);transition:.15s}
.d b{display:block;font-size:17px;color:var(--tx)}.d.on{background:var(--ac);color:#fff}.d.on b{color:#fff}.d.td{outline:2px solid var(--ac);outline-offset:-2px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.nav button{padding:6px 12px;border-radius:12px;background:var(--sf)}.nav .today{background:var(--ac);color:#fff}
#syncMeta{color:var(--t2);font-size:12px;margin:-4px 0 12px;text-align:center}
.change-note{font-size:12px;color:var(--or);margin-top:5px;line-height:1.35}
.card{background:var(--sf);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .12s}
.card:active{transform:scale(.985)}.card.now{outline:2px solid var(--ac)}
.tm{min-width:52px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}.tm small{display:block;color:var(--t2);font-weight:400}
.nm{font-weight:600;font-size:17px}.mt{color:var(--t2);font-size:14px}
.card.normal{border-left:4px solid var(--ac)}.card.cancel{border-left:4px solid var(--rd)}.card.cancel .nm{text-decoration:line-through;color:var(--t2)}.card.changed{border-left:4px solid var(--gr)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;margin-top:4px;color:#fff}
.b-normal{background:var(--ac)}.b-cancel{background:var(--rd)}.b-changed{background:var(--gr)}.b-now{background:var(--ac)}
.empty{text-align:center;color:var(--t2);padding:40px 10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ac);color:#fff;padding:14px 22px;border-radius:26px;font-weight:600;box-shadow:0 6px 18px rgba(0,122,255,.35)}
dialog{border:0;border-radius:20px;background:var(--bg);color:var(--tx);width:min(520px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;margin:12px 0 4px;color:var(--t2);font-size:14px}
input,select{width:100%;font:inherit;padding:10px;border-radius:12px;border:0;background:var(--sf);color:var(--tx)}
.pri{background:var(--ac);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;margin-top:14px;width:100%}.sec{padding:12px;width:100%}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border-radius:14px;padding:10px 12px;margin-bottom:8px}.row input{width:auto;margin-top:4px}
pre{white-space:pre-wrap;font-size:12px;background:var(--sf);padding:10px;border-radius:12px;max-height:200px;overflow:auto}
#st{color:var(--t2);font-size:14px;margin-top:10px}
</style></head><body><main>
<div class="top"><div><h1 id="h"></h1><p class="sub" id="s"></p></div><div style="display:flex;gap:8px"><button class="refresh" id="gear" aria-label="Настройки">⚙</button><button class="refresh" id="refresh">↻ Обновить</button></div></div>
<div class="days" id="days"></div>
<div class="nav"><button id="pw">‹ Неделя</button><span id="wk" class="sub" style="margin:0"></span><button id="today" class="today">Сегодня</button><button id="nw">Неделя ›</button></div><div id="syncMeta"></div>
<div id="list"></div></main>
<dialog id="dg"></dialog>



<script>
(function(){
 function show(message){
  let box=document.getElementById('campus-error');
  if(!box){
   box=document.createElement('div');box.id='campus-error';
   box.style.cssText='position:fixed;z-index:99999;left:10px;right:10px;bottom:10px;padding:14px;background:#8b1d1d;color:white;border-radius:12px;font:14px/1.4 system-ui;white-space:pre-wrap;max-height:40vh;overflow:auto';
   document.body.appendChild(box);
  }
  box.textContent='Ошибка Campus: '+message;
 }
 window.addEventListener('error',function(e){show((e.message||'JavaScript error')+' · '+(e.filename||'')+':'+(e.lineno||''));});
 window.addEventListener('unhandledrejection',function(e){show('Promise: '+String(e.reason&&e.reason.stack||e.reason));});
 window.addEventListener('DOMContentLoaded',function(){
  if('serviceWorker' in navigator){
   navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update().catch(function(){});});
  }
 });
})();
</script>
<script>
const Ад='Адринский И.Г.',Зи='Зинченко А.К.',Бе='Березовский Д.В.',Иж='Ижойкин Ю.М.',Ше='Шефер А.В.',По='Подшивалова Д.А.',Еф='Ефимов В.С.',Ур='Урванцев А.Е.',Ан='Антонова О.Н.',Пе='Передрей А.Е.';
const A=(s,t,r)=>[s,[0,t,r]],G=(s,a,ra,b,rb)=>[s,[1,a,ra],[2,b,rb]];
const EK=()=>G('ЭксКС+',Ад,'118+',Зи,'118+'),RE=()=>G('РЭАС+',Ше,'312+',По,'312+'),IN=()=>G('ИнЯзПД',Ан,'403',Пе,'204');
// Три строки дня = пары 4, 5, 6. Ключ: неделя -> день (1=пн)
const BASE={1:{1:[EK(),A('ЭлСхем',Бе,'214'),A('БЖД',Иж,'504')],2:[RE(),A('ЭлСхем',Бе,'214'),A('Философ',Еф,'323')],3:[A('ЭксКС',Ад,'116'),A('ЭлСхем',Бе,'214'),A('РЭАС',Ше,'312+')],4:[RE(),A('РЭАС',Ше,'312+'),A('Философ',Еф,'323')],5:[RE(),A('Физ-ра',Ур,'401'),EK()],6:[EK(),A('ЭксКС',Ад,'312+'),IN()]},
2:{1:[A('ЭксКС',Ад,'315+'),A('РЭАС',Ше,'312+'),A('ЭлСхем',Бе,'214')],2:[RE(),A('ЭксКС',Ад,'312+'),A('БЖД',Иж,'504')],3:[EK(),A('Физ-ра',Ур,'401'),A('РЭАС',Ше,'312+')],4:[A('Философ',Еф,'323'),A('ЭлСхем',Бе,'214'),EK()],5:[A('ЭксКС',Ад,'116'),RE(),A('ЭлСхем',Бе,'214')],6:[A('Философ',Еф,'323'),A('ЭлСхем',Бе,'214'),IN()]}};
const BELL={n:[['8:00','9:30'],['9:40','11:00'],['11:40','13:00'],['13:40','15:10'],['15:20','16:40'],['17:20','18:40']],
t13:[['8:00','9:20'],['9:30','10:50'],['11:50','13:10'],['14:10','15:20'],['15:30','16:50'],['17:30','18:40']],
t24:[['8:00','9:30'],['9:40','11:10'],['11:40','13:00'],['14:20','15:40'],['15:50','17:00'],['17:30','18:40']]};
const DN=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],DS=['Пн','Вт','Ср','Чт','Пт','Сб'];
const $=i=>document.getElementById(i),ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cfg=ld('cfg',{subgroup:'all'}),chg=[],cur=new Date();cur.setHours(0,0,0,0);
const REFRESH_MS=5*60*1000;
let lastFetchAt=Date.now(),nextRefreshAt=Date.now()+REFRESH_MS;
function updateRefreshMeta(){
 const left=Math.max(0,nextRefreshAt-Date.now());
 const mm=String(Math.floor(left/60000)).padStart(2,'0');
 const ss=String(Math.floor((left%60000)/1000)).padStart(2,'0');
 const checked=new Date(lastFetchAt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 $('syncMeta').textContent='Проверено '+checked+' · следующая проверка через '+mm+':'+ss;
}
const normalizeLessons=items=>items.map(x=>({...x,date:String(x.date).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3')}));
const SUBJECT_SHORT={
 'Электроника и схемотехника':'ЭлСхем',
 'Эксплуатация компьютерных сетей':'ЭксКС',
 'Безопасность жизнедеятельности':'БЖД',
 'Разработка и эксплуатация автоматизированных систем':'РЭАС',
 'Основы философии':'Философ',
 'Физическая культура':'Физ-ра',
 'Иностранный язык в профессиональной деятельности':'ИнЯзПД'
};
const shortSubject=s=>SUBJECT_SHORT[s]||s;
const shortTeacher=s=>{
 const parts=String(s||'').trim().split(/\s+/);
 return parts.length>=3 ? parts[0][0]+'.'+parts[1][0]+'. '+parts.slice(2).join(' ') : (s||'');
};
let scheduleData=ld('remoteSchedule',null),remoteLessons=normalizeLessons(scheduleData?.lessons||[]);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function bells(d){if(d.getDay()!==4)return BELL.n;const k=Math.ceil(d.getDate()/7);return k===1||k===3?BELL.t13:k===2||k===4?BELL.t24:BELL.n}
const tag=s=>(s||'').match(/([12])\s*пг/i)?.[1]|0,clean=s=>(s||'').replace(/\+?\s*[12]\s*пг/i,'').replace(/\+$/,'').trim();
function resolve(d){
 const date=iso(d);
 const out=remoteLessons.filter(x=>x.date===date).map(x=>{
  if(x.subject||x.subj){
   const status=x.status||'normal';
   return {
    id:x.id||x.lesson_id||date+'-'+x.pair+'-'+x.position,
    pair:Number(x.pair)||1,
    position:Number(x.position)||1,
    subgroup:Number(x.subgroup)||0,
    subj:x.subject||x.subj,
    teacher:x.teacher||'',
    room:x.room||'',
    s:x.start||x.time_start||'',
    e:x.end||x.time_end||'',
    st:status==='cancelled'?'cancel':status==='changed'?'changed':'normal',
    previous:x.previous||null
   };
  }
  const lines=String(x.text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const ti=lines.findIndex(s=>/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/.test(s));
  const time=ti>=0?lines[ti].match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/):null;
  return {id:x.id||'',pair:Number(x.lesson),position:Number(x.position)||1,subj:lines[0]||'Занятие',teacher:ti>1?lines[1]:'',room:ti>=0?(lines.slice(ti+1).find(s=>/^[0-9]{2,3}[а-яa-z]?\+?$/i.test(s))||''):'',s:time?time[1]:'',e:time?time[2]:'',st:null};
 }).filter(x=>Number.isFinite(x.pair)&&x.pair>0);

 const bl=bells(d);
 out.forEach(l=>{
  if(!l.s||!l.e){
   const times=bl[l.pair-1]||['',''];
   l.s=l.s||times[0];l.e=l.e||times[1];
  }
 });
 // Не выводим подгруппу из номера позиции: общие и неоднозначные пары
 // должны оставаться видимыми в обоих фильтрах.
 out.forEach(l=>{l.subgroup=Number(l.subgroup)||0;l.subj=shortSubject(l.subj);l.teacher=shortTeacher(l.teacher)});
 const selected=cfg.subgroup||'all';
 return out.filter(l=>selected==='all'||!l.subgroup||String(l.subgroup)===selected).sort((a,b)=>a.pair-b.pair||a.position-b.position);
}

async function loadSchedule(){
 try{
  const response=await fetch('./schedule.json',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.lessons))throw new Error('Некорректный schedule.json');
  scheduleData=data;remoteLessons=normalizeLessons(data.lessons);
  sv('remoteSchedule',data);
  render();
  return true;
 }catch(error){
  console.warn('Не удалось обновить расписание:',error);
  if(!scheduleData){
   scheduleData=ld('remoteSchedule',null);
   remoteLessons=normalizeLessons(scheduleData?.lessons||[]);
  }
  render();
  return false;
 }finally{
  lastFetchAt=Date.now();nextRefreshAt=lastFetchAt+REFRESH_MS;updateRefreshMeta();
 }
}
const mm=t=>{const[a,b]=t.split(':');return+a*60+ +b};
function render(){const d=cur,t=new Date();t.setHours(0,0,0,0);const L=resolve(d);
 $('h').textContent=DN[d.getDay()];$('s').textContent=d.toLocaleDateString('ru',{day:'numeric',month:'long'})+(d.getDay()===4?' · '+(bells(d)===BELL.t13?'классный час':bells(d)===BELL.t24?'метод. час':''):'');
 $('wk').textContent='Дневник'+(scheduleData?.updated_at?' · '+new Date(scheduleData.updated_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'');
 const m=mon(d);$('days').innerHTML=DS.map((n,i)=>{const x=addD(m,i);return`<button class="d ${iso(x)===iso(d)?'on':''} ${iso(x)===iso(t)?'td':''}" data-d="${iso(x)}">${n}<b>${x.getDate()}</b></button>`}).join('');
 const nowM=new Date().getHours()*60+new Date().getMinutes(),isT=iso(d)===iso(t);
 const hasDate=remoteLessons.some(x=>x.date===iso(d));
 $('list').innerHTML=L.length?L.map(l=>{const now=isT&&l.st!=='cancel'&&nowM>=mm(l.s)&&nowM<=mm(l.e);
  const bd={normal:'По расписанию',cancel:'Отменено',changed:'Изменено'}[l.st];
  const p=l.previous,changes=[];
  if(p){
   if(p.subject!==undefined&&shortSubject(p.subject)!==l.subj)changes.push('предмет: '+shortSubject(p.subject));
   if(p.teacher!==undefined&&shortTeacher(p.teacher)!==l.teacher)changes.push('преподаватель: '+(shortTeacher(p.teacher)||'не указан'));
   if(p.room!==undefined&&p.room!==l.room)changes.push('кабинет: '+(p.room||'не указан'));
   if(p.pair!==undefined&&Number(p.pair)!==Number(l.pair))changes.push('пара: '+p.pair+' → '+l.pair);
   if((p.start!==undefined&&p.start!==l.s)||(p.end!==undefined&&p.end!==l.e))changes.push('время: '+(p.start||'—')+'–'+(p.end||'—')+' → '+l.s+'–'+l.e);
  }
  const changeText=l.st==='changed'?(changes.length?'Изменилось: '+changes.join('; '):'Изменено в Дневнике.ру'): '';
  return`<div class="card ${l.st==='cancel'?'cancel':l.st==='changed'?'changed':'normal'}"><div class="tm">${l.s}<small>${l.e}</small></div><div><div class="nm">${l.subj}</div><div class="mt">${l.pair} пара${l.room?' · каб. '+l.room:''}${l.teacher?' · '+l.teacher:''}</div>${bd?`<span class="badge b-${l.st}">${bd}</span>`:''}${now?'<span class="badge b-now">Идёт сейчас</span>':''}${changeText?`<div class="change-note">${changeText}</div>`:''}</div></div>`}).join(''):`<div class="empty">${hasDate?(d.getDay()?'В этот день занятий нет.':'Воскресенье — выходной.'):'На эту дату нет данных из Дневника.'}<br>Проверьте расписание Дневник.ру позже.</div>`}
$('days').onclick=e=>{const b=e.target.closest('[data-d]');if(b){cur=new Date(b.dataset.d+'T00:00');render()}};
$('pw').onclick=()=>{cur=addD(cur,-7);render()};$('nw').onclick=()=>{cur=addD(cur,7);render()};$('today').onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);render()};
const dg=$('dg');
$('gear').onclick=()=>{
 dg.innerHTML=`<h2 style="margin:0">Настройки</h2><p class="sub">Источник: Дневник.ру · группа БП314</p><label>Подгруппа</label><select id="sg"><option value="all">Обе подгруппы</option><option value="1">1 подгруппа</option><option value="2">2 подгруппа</option></select><button class="pri" id="ok">Сохранить</button>`;
 $('sg').value=cfg.subgroup||'all';
 $('ok').onclick=()=>{cfg={subgroup:$('sg').value};sv('cfg',cfg);dg.close();render()};
 dg.showModal();
};
$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;b.textContent='Обновляю…';const ok=await loadSchedule();b.disabled=false;b.textContent=ok?'↻ Обновить':'Повторить';};
render();loadSchedule();setInterval(render,60000);setInterval(updateRefreshMeta,1000);setInterval(loadSchedule,REFRESH_MS);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
