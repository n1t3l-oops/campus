name: Cloud environment check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cloud-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps chromium

      - name: Test public Dnevnik page without authentication
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit

          url = (
              "https://schools.dnevnik.ru/v2/r/omsk/schedules/view"
              "?school=53237&group=2509016193679422543"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              response = page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              final = urlsplit(page.url)
              print("HTTP status:", response.status if response else "none")
              print("Final host:", final.hostname)
              print("Final path:", final.path)
              print("Page title:", page.title())
              print(
                  "Schedule table found:",
                  page.locator(
                      "table.scheduleWeekEditorParent"
                  ).count() > 0
              )
              browser.close()
          PY
